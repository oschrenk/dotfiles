[project]
name = "dotfiles"
revision = "1.0"
# An agent must state its intent for the audit log.
require_reason = "agents"

[providers]
homelab = "onepassword://Homelab"

###################
# SECRETS
###################

# Rules:
# - a ref names the `item`, optionally the `section`, and the `field`.
# - a name contains only `a-z`, `A-Z`, `0-9`, `-`, `_`, `.` and the space character.
# - any other character, `/` included, makes 1Password use a UUID.
# - if a name contains a different character, change the name in 1Password.
# - names are not case-sensitive. Put quotation marks around a ref that contains a space.
# - a rename in 1Password breaks the ref.
[profiles.default]

# --- ntfy ---
NTFY_HOMELAB_BACKUPS_URL = { description = "ntfy topic URL for homelab backup alerts", providers = [
  "homelab",
], ref = { item = "Ntfy", field = "homelab-backups" } }

###################
# SCOPES
###################

[scopes.ntfy]
secrets = ["NTFY_HOMELAB_BACKUPS_URL"]

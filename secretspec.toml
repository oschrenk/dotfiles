[project]
name = "dotfiles"
revision = "1.0"
# An agent must state its intent for the audit log.
require_reason = "agents"

[providers]
dotfiles = "onepassword://Dotfiles"

# Every secret resolves through this chain unless it declares its own.
[defaults]
providers = ["dotfiles"]

###################
# RULES
###################

# - an item is titled after the tool that reads it
# - a ref names the `item`, optionally the `section`, and the `field`.
# - a name contains only `a-z`, `A-Z`, `0-9`, `-`, `_`, `.` and the space character.
# - any other character, `/` included, makes 1Password use a UUID.
# - if a name contains a different character, change the name in 1Password.
# - names are not case-sensitive. Put quotation marks around a ref that contains a space.
# - a rename in 1Password breaks the ref.

# workarounds for opnix on a `kind = "file"`
# - opnix rejects a section selector on a `kind = "file"` reference and
#   matches the attachment by filename across the whole item.
#   Keep the filename unique within the item and do NOT use a section

[profiles.default]

###################
# DARWIN
###################

# --- atuin ---
ATUIN_SYNC_KEY = { description = "Atuin sync key read by the atuin daemon", ref = { item = "atuin", section = "Sync", field = "key" } }

# --- cottage ---
COTTAGE_IDENTITY = { description = "age identity cottage decrypts with", ref = { item = "cottage", field = "identity" } }

# --- gh ---
GITHUB_TOKEN_CLAUDE = { description = "fine-grained GitHub PAT for the Claude Code Bash tool", ref = { item = "github.com", section = "gh for claude code", field = "GITHUB_TOKEN_CLAUDE" } }

# --- gitwatch ---
INFUSE_DEPLOY_KEY = { description = "deploy key gitwatch pushes infuse-data with", ref = { item = "infuse-data", field = "private key" } }
INFUSE_DEPLOY_KEY_PUB = { description = "public half of INFUSE_DEPLOY_KEY", ref = { item = "infuse-data", field = "public key" } }

# --- jira ---
# references an opnix kind = "file"
JIRA_CONFIG = { description = "jira-cli config.yml", ref = { item = "jira-cli-go", field = "config.yml" } }

# --- lific ---
LIFIC_BEARER_TOKEN = { description = "lific API key for the Claude Code MCP server", ref = { item = "lific", field = "LIFIC_BEARER_TOKEN" } }

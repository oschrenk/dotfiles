[project]
name = "dotfiles"
revision = "1.0"
# An agent must state its intent for the audit log.
require_reason = "agents"

[providers]
homelab = "onepassword://Homelab"
bootstrap = "onepassword://Bootstrap"

###################
# RULES
###################

# - a ref names the `item`, optionally the `section`, and the `field`.
# - a name contains only `a-z`, `A-Z`, `0-9`, `-`, `_`, `.` and the space character.
# - any other character, `/` included, makes 1Password use a UUID.
# - if a name contains a different character, change the name in 1Password.
# - names are not case-sensitive. Put quotation marks around a ref that contains a space.
# - a rename in 1Password breaks the ref.
[profiles.default]

###################
# NIXOS
###################

# --- ntfy ---
NTFY_HOMELAB_BACKUPS_URL = { description = "ntfy topic URL for homelab backup alerts", providers = [
  "homelab",
], ref = { item = "Ntfy", field = "homelab-backups" } }

# --- restic ---
RESTIC_REPOSITORY_PASSWORD = { description = "Password for the shared restic repository", providers = [
  "homelab",
], ref = { item = "Restic", field = "password" } }

# --- beszel ---
BESZEL_AGENT_PUBLIC_KEY = { description = "Public key the beszel agents authenticate with", providers = [
  "homelab",
], ref = { item = "Beszel", field = "Public Key" } }

# --- UNAS ---
UNAS_SMB_CREDENTIALS = { description = "SMB credentials for mounting the UNAS backup share", providers = [
  "homelab",
], ref = { item = "nlu6b76afi6kmgrjovrlw7bnrq", field = "smb credentials" } }

# --- adguard ---
ADGUARD_USERNAME = { description = "AdGuard Home admin username", providers = [
  "homelab",
], ref = { item = "Adguard Home", field = "username" } }

ADGUARD_PASSWORD_HASH = { description = "AdGuard Home admin bcrypt password hash", providers = [
  "homelab",
], ref = { item = "Adguard Home", field = "bcrypt password" } }

# --- beszel hub ---
BESZEL_HUB_ADMIN = { description = "Beszel hub admin environment", providers = [
  "homelab",
], ref = { item = "Beszel", field = "notesPlain" } }

BESZEL_HUB_PRIVATE_KEY = { description = "Beszel hub SSH private key", providers = [
  "homelab",
], ref = { item = "Beszel", field = "Private Key" } }

# --- fusion ---
FUSION_PASSWORD = { description = "Fusion service password", providers = [
  "homelab",
], ref = { item = "Fusion", field = "password" } }

# --- glance ---
WAQI_API_TOKEN = { description = "World Air Quality Index API token read by glance", providers = [
  "homelab",
], ref = { item = "Air Quality Open Data Platform", field = "API token" } }

# --- cloudflare ---
CLOUDFLARE_DNS_CHALLENGE_TOKEN = { description = "Cloudflare token Traefik uses for the DNS-01 challenge", providers = [
  "homelab",
], ref = { item = "cloudflare.com", section = "Challenge", field = "token" } }

CLOUDFLARE_R2_ACCESS_KEY_ID = { description = "R2 access key ID for the offsite restic copy", providers = [
  "homelab",
], ref = { item = "cloudflare.com R2", section = "Restic", field = "Access Key ID" } }

CLOUDFLARE_R2_SECRET_ACCESS_KEY = { description = "R2 secret access key for the offsite restic copy", providers = [
  "homelab",
], ref = { item = "cloudflare.com R2", section = "Restic", field = "Secret Access Key" } }

# --- perses ---
PERSES_ENCRYPTION_KEY = { description = "Perses encryption key", providers = [
  "homelab",
], ref = { item = "Perses", field = "encryption key" } }

PERSES_ADMIN_PASSWORD = { description = "Perses admin password", providers = [
  "homelab",
], ref = { item = "Perses", field = "password" } }

# --- unpoller ---
# Both addressed by item ID: the titles "Unas / Local Logins" and
# "Unifi / Local Admin" contain slashes, which make an op:// URI ambiguous.
UNAS_ACCOUNT_PASSWORD = { description = "UNAS local account password unpoller reads", providers = [
  "homelab",
], ref = { item = "4rysqwcs2u5st5xzoy22gfz7au", field = "password" } }

UNIFI_ADMIN_PASSWORD = { description = "UniFi controller local admin password unpoller reads", providers = [
  "homelab",
], ref = { item = "spjanmeqbrmygc5e2ijapwzkhe", field = "password" } }

###################
# DARWIN
###################

# --- atuin ---
ATUIN_SYNC_KEY = { description = "Atuin sync key read by the atuin daemon", providers = [
  "bootstrap",
], ref = { item = "Atuin Sync Key", field = "password" } }

# --- cottage ---
COTTAGE_IDENTITY = { description = "age identity cottage decrypts with", providers = [
  "bootstrap",
], ref = { item = "Cottage Identity", field = "password" } }

# --- jira ---
JIRA_CONFIG = { description = "Full jira-cli config.yml", providers = [
  "bootstrap",
], ref = { item = "sixufe2idosinhgbqbzuvvukyi", field = "config" } }

###################
# SCOPES
###################

[scopes.ntfy]
secrets = ["NTFY_HOMELAB_BACKUPS_URL"]

[project]
name = "dotfiles"
revision = "1.0"
# An agent must state its intent for the audit log.
require_reason = "agents"

[providers]
bootstrap = "onepassword://Bootstrap"

###################
# RULES
###################

# - an item is titled after the tool that reads it
# - a ref names the `item`, optionally the `section`, and the `field`.
# - a name contains only `a-z`, `A-Z`, `0-9`, `-`, `_`, `.` and the space character.
# - any other character, `/` included, makes 1Password use a UUID.
# - if a name contains a different character, change the name in 1Password.
# - names are not case-sensitive. Put quotation marks around a ref that contains a space.
# - a rename in 1Password breaks the ref.
[profiles.default]

###################
# DARWIN
###################

# --- atuin ---
ATUIN_SYNC_KEY = { description = "Atuin sync key read by the atuin daemon", providers = [
  "bootstrap",
], ref = { item = "atuin", section = "Sync", field = "key" } }

# --- cottage ---
COTTAGE_IDENTITY = { description = "age identity cottage decrypts with", providers = [
  "bootstrap",
], ref = { item = "cottage", field = "identity" } }

# --- jira ---
JIRA_CONFIG = { description = "jira-cli config.yml", providers = [
  "bootstrap",
], ref = { item = "jira-cli-go", section = "timewax.atlassian.net", field = "config.yml" } }

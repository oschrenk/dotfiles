version: '3'
tasks:
  customize:extensions:
    desc: Install the browser extensions listed in scripts/data/arc-extensions.txt into Arc
    # Each install relaunches Arc, so this is run on purpose, not on every rebuild.
    cmds:
      - scripts/install-arc-extensions.sh
  customize:icons:
    desc: Stamp the custom icons in assets/icons onto the installed apps
    # Needs sudo and App Management permission for the calling shell, and ends
    # by restarting the Dock so the new icons are picked up.
    cmds:
      - scripts/set-app-icons.sh
  customize:wallpaper:
    desc: Set the desktop wallpaper from assets/wallpaper
    cmds:
      - scripts/set-wallpaper.sh
  customize:keyboard:
    desc: Set keyboard brightness, disable the space-switching hotkeys, and bind Calendar's list toggle
    # Ends by restarting the Dock so WindowServer re-reads the hotkey grabs, and
    # asks before restarting Calendar, so this is run on purpose rather than on
    # every rebuild.
    cmds:
      - scripts/configure-keyboard.sh
  nvim:blink:
    desc: Rebuild the blink.cmp Rust fuzzy matcher after a plugin update
    # The dylib filename is keyed to the checked-out commit, so every
    # blink.cmp update leaves the previous build unreachable and completion
    # silently falls back to the Lua matcher.
    cmds:
      - scripts/build-blink-fuzzy.sh
  bootstrap:infuse:
    desc: Clone the infuse data repo and give it a commit identity (run once, after 1Password is set up)
    cmds:
      - scripts/bootstrap-infuse.sh
  nix:setup:identity:
    desc: Create nix/identity.nix interactively (run once when forking or when identity changes)
    dir: nix
    cmds:
      - ./setup-identity.sh
  nix:rebuild:
    desc: Apply nix configuration to the Mac
    deps: ['nix:rebuild:darwin']
  nix:rebuild:darwin:
    desc: Apply nix-darwin configuration to the current Mac (auto-selects host via hostname)
    cmds:
      # opnix exits 0 when the token is missing, silently provisioning nothing.
      # Fail loudly here instead so new secrets can't vanish unnoticed.
      - '[ -s /etc/opnix-token ] || { echo "ERROR: /etc/opnix-token is missing or empty — opnix will silently skip all secrets. Run: sudo opnix token set" >&2; exit 1; }'
      - sudo /run/current-system/sw/bin/darwin-rebuild switch --flake "./nix#{{.HOSTNAME}}" --option warn-dirty false
      # gitwatch-infuse crash-loops when its repo is absent and reports it only
      # to a logfile nobody reads. Warn, don't fail — a missing clone is not a
      # reason to hold up the switch.
      - '[ -d "$HOME/.local/share/infuse/.git" ] || echo "WARNING: ~/.local/share/infuse is missing — gitwatch-infuse will crash-loop. Run: task bootstrap:infuse" >&2'
    vars:
      HOSTNAME:
        sh: hostname -s
  nix:update:preview:
    desc: Preview what a flake input update changes — packages, home-manager news, and options (read-only)
    # thaw covers packages and news; the script covers what thaw does not,
    # the nix-darwin, home-manager and opnix option surfaces.
    cmds:
      - cd nix && thaw packages
      - cd nix && thaw news
      - scripts/options-update-preview.sh
  nix:update:
    desc: Update all flake inputs (nixpkgs, nix-darwin, home-manager, etc.)
    dir: nix
    cmds:
      - nix flake update
  nix:update:nixpkgs:
    desc: Update only the nixpkgs input
    dir: nix
    cmds:
      - nix flake update nixpkgs
  nix:update:darwin:
    desc: Update only the nix-darwin input
    dir: nix
    cmds:
      - nix flake update nix-darwin
  nix:update:home-manager:
    desc: Update only the home-manager input
    dir: nix
    cmds:
      - nix flake update home-manager
  nix:fmt:
    desc: Format all nix files
    dir: nix
    cmds:
      - nix fmt --no-warn-dirty
  nix:test:
    desc: Run the nix unit tests
    dir: nix
    cmds:
      - nix build --no-warn-dirty --no-link --print-build-logs .#checks.aarch64-darwin.secrets
      - echo "tests passed"

  nix:gc:
    desc: Garbage-collect old generations and dedupe the nix store
    # sudo run cleans the system/darwin profile; the unprivileged run cleans
    # the user profile (home-manager, nix-shell roots). `optimise` hardlinks
    # identical files across the store after GC frees them up.
    cmds:
      - sudo nix-collect-garbage -d
      - nix-collect-garbage -d
      - nix store optimise
version: '3'
# NIX_SSHOPTS: adds SSH keepalives so nix copy fails fast (90s) 
# instead of hanging on TCP timeout when remote host is unreachable.
env:
  NIX_SSHOPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=3
tasks:
  customize:extensions:
    desc: Install the browser extensions listed in scripts/data/arc-extensions.txt into Arc
    # Each install relaunches Arc, so this is run on purpose, not on every rebuild.
    cmds:
      - scripts/install-arc-extensions.sh
  customize:icons:
    desc: Stamp the custom icons in assets/icons onto the installed apps
    # Needs sudo and App Management permission for the calling shell, and ends
    # by restarting the Dock so the new icons are picked up.
    cmds:
      - scripts/set-app-icons.sh
  customize:wallpaper:
    desc: Set the desktop wallpaper from assets/wallpaper
    cmds:
      - scripts/set-wallpaper.sh
  bootstrap:infuse:
    desc: Clone the infuse data repo and give it a commit identity (run once, after 1Password is set up)
    cmds:
      - scripts/bootstrap-infuse.sh
  nix:setup:identity:
    desc: Create nix/identity.nix interactively (run once when forking or when identity changes)
    dir: nix
    cmds:
      - ./setup-identity.sh
  nix:rebuild:
    desc: Apply nix configuration to the Mac and all three pis
    deps: [nix:rebuild:darwin, nix:rebuild:pi]
  nix:rebuild:darwin:
    desc: Apply nix-darwin configuration to the current Mac (auto-selects host via hostname)
    # nix-daemon (running as root via sudo) refuses world-readable SSH keys, so
    # force 0600 before the build, then restore 0644 after for oliver-as-user
    # SSH (interactive `ssh builder@linux-builder` and the nix-rebuild-pi-* builds).
    # A reboot resets it to 0600 when the builder daemon recreates the key;
    # a pi task re-fixes it. Guarded so hosts without a linux-builder (no key)
    # don't abort the task.
    cmds:
      # opnix exits 0 when the token is missing, silently provisioning nothing.
      # Fail loudly here instead so new secrets can't vanish unnoticed.
      - '[ -s /etc/opnix-token ] || { echo "ERROR: /etc/opnix-token is missing or empty — opnix will silently skip all secrets. Run: sudo opnix token set" >&2; exit 1; }'
      - '[ -f /etc/nix/builder_ed25519 ] && sudo chmod 600 /etc/nix/builder_ed25519 || true'
      - sudo /run/current-system/sw/bin/darwin-rebuild switch --flake "./nix#{{.HOSTNAME}}" --option warn-dirty false
      - '[ -f /etc/nix/builder_ed25519 ] && sudo chmod 644 /etc/nix/builder_ed25519 || true'
      # gitwatch-infuse crash-loops when its repo is absent and reports it only
      # to a logfile nobody reads. Warn, don't fail — a missing clone is not a
      # reason to hold up the switch.
      - '[ -d "$HOME/.local/share/infuse/.git" ] || echo "WARNING: ~/.local/share/infuse is missing — gitwatch-infuse will crash-loop. Run: task bootstrap:infuse" >&2'
    vars:
      HOSTNAME:
        sh: hostname -s
  homelab:perses-dashboards:
    desc: Rebuild the Perses dashboards from CUE and lint the output
    dir: nix/modules/nixos/perses
    # Output is committed; nix reads it directly. percli needs cue on PATH and
    # network access to the CUE module registry to resolve dashboard deps.
    # -m stdout because percli only lets you choose the output *folder*, and names
    # the file <name>_output.yaml inside it. Redirecting gives a .gen.yaml that
    # reads as generated rather than a stray build directory in the nix tree.
    cmds:
      - |
        {
          echo '# Generated by `task homelab:perses-dashboards` from homelab.cue — do not edit.'
          percli dac build -f homelab.cue -m stdout
        } > homelab.gen.yaml
      - percli lint -f homelab.gen.yaml
  homelab:prometheus-cost-backfill:
    desc: Recompute the PoE cost recording rules over PoE history that predates them (pi-2)
    # Recording rules only emit samples from the moment they land, so the cost panels
    # start empty while the watts behind them go back to the start of retention. This
    # recomputes the rules from data already in the TSDB and installs the blocks.
    #
    # START is optional: left empty, the script derives it from the first sample of
    # the source metric. Do not default it to the retention window — promtool
    # allocates per 2h window whether or not the window holds data, and a 90-day
    # range exhausted memory on pi-2 badly enough to take sshd with it.
    #
    # Override for a narrower range: task homelab:prometheus-cost-backfill START=2026-08-24T00:00:00Z
    cmds:
      - ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 oliver@pi-2.local sudo bash -s -- '{{.START}}' '{{.END}}' < scripts/prometheus-cost-backfill.sh
  homelab:fx-backfill:
    desc: Backfill GTQ-per-EUR daily history into Prometheus on pi-2
    # One sample per day, because that is how often the rate exists. Query it as
    # last_over_time(fx_rate{base="EUR",quote="GTQ"}[36h]) — a bare fx_rate is
    # outside Prometheus' 5m lookback for all but 5 minutes of each day.
    #
    # Days defaults to 90 to match retention; more than that is written and then
    # swept on the next compaction. Override: task homelab:fx-backfill DAYS=30
    cmds:
      - scripts/fx-backfill.sh {{.DAYS | default 90}}
  nix:builder:up:
    desc: Start the linux-builder VM if it is not already running, and wait for it
    # The daemon is RunAtLoad=false / KeepAlive=false, so it is not running unless
    # something asked for it. kickstart without -k is a no-op when already up.
    #
    # kickstart only starts a service launchd already knows about. A plist written by
    # darwin activation but never bootstrapped is unknown, so kickstart exits 113
    # ("Could not find service") and every pi rebuild dies before it builds. Register
    # it and try again — and kickstart after bootstrap, not instead of it, because
    # RunAtLoad=false means registering alone spawns nothing. Unlike nix-builder-force
    # this leaves nixos.qcow2 and its build cache untouched.
    cmds:
      - |
        sudo launchctl kickstart system/org.nixos.linux-builder || {
          sudo launchctl bootstrap system /Library/LaunchDaemons/org.nixos.linux-builder.plist
          sudo launchctl kickstart system/org.nixos.linux-builder
        }
      - until nc -z localhost 31022; do sleep 2; done
  nix:builder:down:
    desc: Stop the linux-builder VM and wait for it to go away
    # launchctl stop SIGTERMs QEMU, which closes its block devices before exiting: the
    # guest sees a power cut, but the image is flushed. That is as clean as this VM
    # gets — the guest's builder user has no passwordless sudo, so it cannot be told to
    # halt itself, and QEMU_OPTS configures no monitor socket to send system_powerdown
    # to. What must not happen is pkill -9: an image killed mid-write costs the whole
    # build cache to recover, per docs/nix/builder.md.
    #
    # KeepAlive=false, so nothing respawns it, and the job stays registered — which
    # leaves nix-builder-up a plain kickstart afterwards.
    cmds:
      # launchctl stop exits 3 here: the job launchd tracks is the create-builder shell
      # wrapper, and killing it does not reach the QEMU it spawned — the wrapper exits
      # and QEMU is reparented, still serving 31022. So signal both, and match QEMU on
      # the builder's own image path rather than `pkill -f qemu-system-aarch64`, which
      # would take down any other VM on the machine.
      #
      # SIGTERM, never -9: QEMU closes its block devices on TERM, so the image is
      # flushed. An image killed mid-write costs the whole build cache to recover, per
      # docs/nix/builder.md.
      - sudo launchctl kill TERM system/org.nixos.linux-builder || true
      - sudo pkill -f 'file=/private/var/lib/linux-builder/nixos.qcow2' || true
      - until ! nc -z localhost 31022; do sleep 2; done
  nix:builder:restart:
    desc: Restart the linux-builder VM
    cmds:
      - sudo launchctl kickstart -k system/org.nixos.linux-builder
  nix:builder:force:
    desc: Force reset the linux-builder VM (recreates working dir, disk, and fixes key permissions)
    # bootout/bootstrap (not kickstart) because EX_CONFIG exits put launchd into
    # an extended-backoff state where kickstart no-ops. Unregistering and
    # re-registering wipes the error history so RunAtLoad triggers a fresh spawn.
    cmds:
      - sudo mkdir -p /var/lib/linux-builder
      - sudo rm -f /var/lib/linux-builder/nixos.qcow2
      - sudo launchctl bootout system/org.nixos.linux-builder || true
      - sudo launchctl bootstrap system /Library/LaunchDaemons/org.nixos.linux-builder.plist
      - sleep 30
      - sudo chmod 644 /etc/nix/builder_ed25519
  nix:rebuild:pi:
    desc: Apply NixOS configuration to all pis
    deps: [nix:rebuild:pi-1, nix:rebuild:pi-2, nix:rebuild:pi-3]
  nix:rebuild:pi-1:
    desc: Apply NixOS configuration to pi-1
    dir: nix
    cmds:
      - task: nix:builder:up
      - sudo chmod 644 /etc/nix/builder_ed25519
      - nix run nixpkgs#nixos-rebuild -- switch --option warn-dirty false --option extra-substituters "https://nixos-raspberrypi.cachix.org" --option extra-trusted-public-keys "nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=" --flake .#pi-1 --target-host oliver@pi-1.local --build-host builder@linux-builder --sudo
  nix:rebuild:pi-2:
    desc: Apply NixOS configuration to pi-2
    dir: nix
    cmds:
      - task: nix:builder:up
      - sudo chmod 644 /etc/nix/builder_ed25519
      - nix run nixpkgs#nixos-rebuild -- switch --option warn-dirty false --option extra-substituters "https://nixos-raspberrypi.cachix.org" --option extra-trusted-public-keys "nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=" --flake .#pi-2 --target-host oliver@pi-2.local --build-host builder@linux-builder --sudo
  nix:rebuild:pi-3:
    desc: Apply NixOS configuration to pi-3
    dir: nix
    cmds:
      - task: nix:builder:up
      - sudo chmod 644 /etc/nix/builder_ed25519
      - nix run nixpkgs#nixos-rebuild -- switch --option warn-dirty false --option extra-substituters "https://nixos-raspberrypi.cachix.org" --option extra-trusted-public-keys "nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=" --flake .#pi-3 --target-host oliver@pi-3.local --build-host builder@linux-builder --sudo
  nix:rebuild:hetzner-1:
    desc: Apply NixOS configuration to hetzner-1
    # Relies on a `Host hetzner-1` entry in ~/.ssh/config to resolve the public IP and user.
    dir: nix
    cmds:
      - sudo chmod 644 /etc/nix/builder_ed25519
      - nix run nixpkgs#nixos-rebuild -- switch --option warn-dirty false --flake .#hetzner-1 --target-host oliver@hetzner-1 --build-host builder@linux-builder --sudo
  homelab:tailscale-unas:
    desc: Install and configure Tailscale on UNAS2
    # The auth key lives in 1Password: vault "Homelab" → item "Tailscale / AuthKeys" → field "unas".
    # Keys expire after 90 days; generate a replacement at https://login.tailscale.com/admin/settings/keys
    cmds:
      - ssh root@unas.local env "TAILSCALE_AUTHKEY=$(op read 'op://2udkjdngrnb6jlr62cd7iq33de/2imqxgbvx6htswijyuswh72kye/unas')" sh -s < scripts/setup-tailscale-unas.sh
  nix:update:preview:
    desc: Preview which of my declared packages would change if flake.lock were updated (read-only, does not write flake.lock)
    cmds:
      - HOST={{.HOSTNAME}} scripts/pkg-update-preview.sh
    vars:
      HOSTNAME:
        sh: hostname -s
  nix:update:
    desc: Update all flake inputs (nixpkgs, nixos-raspberrypi, etc.)
    dir: nix
    cmds:
      - nix flake update
  nix:update:nixpkgs:
    desc: Update only the nixpkgs input
    dir: nix
    cmds:
      - nix flake update nixpkgs
  nix:update:rpi:
    desc: Update only the nixos-raspberrypi input (RPi kernel/firmware)
    dir: nix
    cmds:
      - nix flake update nixos-raspberrypi
  nix:update:darwin:
    desc: Update only the nix-darwin input
    dir: nix
    cmds:
      - nix flake update nix-darwin
  nix:update:home-manager:
    desc: Update only the home-manager input
    dir: nix
    cmds:
      - nix flake update home-manager
  nix:fmt:
    desc: Format all nix files
    dir: nix
    cmds:
      - nix fmt --no-warn-dirty
  nix:gc:
    desc: Garbage-collect old generations and dedupe the nix store
    # sudo run cleans the system/darwin profile; the unprivileged run cleans
    # the user profile (home-manager, nix-shell roots). `optimise` hardlinks
    # identical files across the store after GC frees them up.
    cmds:
      - sudo nix-collect-garbage -d
      - nix-collect-garbage -d
      - nix store optimise

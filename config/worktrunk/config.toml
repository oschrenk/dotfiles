# Without --remote, so each submodule stays at the commit the repo pins.
[projects."git.timewax.com/*"]
pre-start = "git -C {{ worktree_path }} submodule update --init --recursive"

[projects."git.timewax.com/timewax/*"]
pre-start = "~/.local/bin/tw wt overlay {{ worktree_path }} {{ repo }}"

[projects."git.timewax.com/nodejs/*"]
pre-start = "~/.local/bin/tw wt overlay {{ worktree_path }} {{ repo }}"

[projects."git.timewax.com/python/*"]
pre-start = "~/.local/bin/tw wt overlay {{ worktree_path }} {{ repo }}"

[projects."git.timewax.com/extjs/*"]
pre-start = "~/.local/bin/tw wt overlay {{ worktree_path }} {{ repo }}"
